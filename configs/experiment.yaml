games: [Breakout, Pong, Boxing]
horizon_K: 50
n_trajectories: 2000           # 2000 minimum for reliable FID estimates
k_star_multiplier: 3          # MUST be re-validated with a pilot after the
                               # rollout-termination fix (commit "fix mid-rollout
                               # env reset") landed; the prior value was tuned
                               # against rollouts that contained the bug.
k_fit_min:                     # per-model exclusion window for power-law fit + k* baseline.
  diamond: 6                   # DIAMOND seeds its 4-frame conditioning buffer with the initial
                               # obs at reset, so the buffer transitions are:
                               #   k=1  buffer=[init,init,init,init]
                               #   k=2  buffer=[init,init,init,pred1]
                               #   k=3  buffer=[init,init,pred1,pred2]
                               #   k=4  buffer=[init,pred1,pred2,pred3]
                               #   k=5  buffer=[pred1,pred2,pred3,pred4]
                               # k=5 is the first all-prediction buffer, but those predictions
                               # were themselves generated from partly-init buffers, so k=5
                               # still shows a warm-up bump. k_fit_min=6 starts the fit one
                               # step past the last warm-up step.
  iris: 2                      # IRIS Transformer KV-cache is initialized from real-obs tokens
                               # at reset; only k=1 is a stateful-initial-step quirk worth skipping.
  dreamerv3: 2                 # RSSM observed once at reset — same reasoning as IRIS.
  mlp: 2                       # stateless: same as IRIS.
                               # Legacy: k_fit_min may also be a single int; exp1 falls back to
                               # global value if a model is not listed here.
fid_horizons: [6, 10, 20, 30, 50]   # k<6 excluded globally — keeps DIAMOND's FID baseline
                                    # well-defined and avoids per-model FID horizons in plots.
seed: 42

models:
  mlp:
    space: ram                 # 128-byte RAM state — alpha NOT comparable to pixel models
    hidden_dim: 256
    n_layers: 3
  dreamerv3:
    space: pixel               # decoded back to 84x84x3 by dreamerv3_rollout.py
    checkpoint: checkpoints/dreamerv3/
  iris:
    space: pixel
    checkpoint: checkpoints/iris/
  diamond:
    space: pixel
    checkpoint: checkpoints/diamond/
